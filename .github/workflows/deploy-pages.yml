name: Build and Deploy Demo Site to gh-pages

on:
  push:
    branches:
      - simulation-demo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "deploy-demo-site"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout simulation-demo branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build static demo preview
        run: npx vite build --base=/${{ github.event.repository.name }}/

      - name: Deploy build output to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
